<svg xmlns="http://www.w3.org/2000/svg" width="58" height="64" viewBox="0 0 58 64" shape-rendering="crispEdges">
  <!-- Juggernaut — armoured rhino-ogre, faces LEFT. Dominant dark brown
       0x5c4a3c. The single forward horn and slab chest plate read as "heavy
       armor" against the brute's bare torso and shoulder plate, even though
       both are large, dark, and slow. -->
  <g>
    <!-- forward horn -->
    <path d="M2 24 L14 18 L14 30 Z" fill="#d4c4a8"/>
    <!-- head -->
    <rect x="10" y="10" width="26" height="20" fill="#5c4a3c"/>
    <rect x="10" y="10" width="26" height="4" fill="#7a6250"/>
    <!-- sunken glowing eyes -->
    <rect x="16" y="18" width="4" height="4" fill="#ff8a3c"/>
    <rect x="26" y="18" width="4" height="4" fill="#ff8a3c"/>
    <!-- ear plates -->
    <rect x="30" y="6" width="8" height="8" fill="#4a3a2e"/>
    <!-- massive torso -->
    <rect x="8" y="30" width="40" height="24" fill="#5c4a3c"/>
    <rect x="8" y="30" width="40" height="4" fill="#7a6250"/>
    <rect x="8" y="50" width="40" height="4" fill="#3a2e24"/>
    <!-- chest armor plate -->
    <rect x="18" y="36" width="22" height="14" fill="#6b6b6b"/>
    <rect x="18" y="36" width="22" height="3" fill="#9aa6b2"/>
    <rect x="22" y="42" width="3" height="3" fill="#3a3a3a"/>
    <rect x="33" y="42" width="3" height="3" fill="#3a3a3a"/>
    <!-- thick legs -->
    <rect x="14" y="54" width="12" height="8" fill="#3a2e24"/>
    <rect x="32" y="54" width="12" height="8" fill="#3a2e24"/>
    <rect x="11" y="60" width="16" height="4" fill="#241a12"/>
    <rect x="30" y="60" width="16" height="4" fill="#241a12"/>
  </g>
</svg>
