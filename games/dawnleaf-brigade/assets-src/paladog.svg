<svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56" shape-rendering="crispEdges">
  <!-- Paladog — paladin dog, faces RIGHT. Dominant blue keeps the established
       0x4a90d9 read; gold trim and a cream muzzle carry the "heroic" note.
       Ears hang beside the head rather than behind the helmet band: tucked
       under it they rendered as two loose brown triangles with no visible
       attachment. The mace head is deliberately oversized for 40px — at this
       scale a correctly-proportioned one reads as a lantern. -->
  <g>
    <!-- helmet with gold crest -->
    <rect x="17" y="0" width="5" height="5" fill="#f0c95a"/>
    <rect x="7" y="3" width="24" height="5" fill="#2f6ea8"/>
    <rect x="7" y="3" width="24" height="2" fill="#4a90d9"/>
    <!-- head -->
    <rect x="9" y="8" width="21" height="14" fill="#c9a678"/>
    <rect x="9" y="8" width="21" height="2" fill="#e0c194"/>
    <!-- floppy ears, hanging beside the head and overlapping it -->
    <rect x="5" y="8" width="5" height="12" fill="#8a6a4a"/>
    <rect x="5" y="17" width="5" height="3" fill="#6f5238"/>
    <rect x="28" y="8" width="3" height="8" fill="#8a6a4a"/>
    <!-- muzzle + nose, pointing right. Kept short (ends at x=32) so the mace
         column beyond it never overlaps the face — twice the nose vanished
         under the mace head and the whole face stopped reading. -->
    <rect x="27" y="15" width="5" height="7" fill="#e0c194"/>
    <rect x="30" y="16" width="2" height="3" fill="#2b2118"/>
    <!-- eye -->
    <rect x="22" y="12" width="3" height="4" fill="#2b2118"/>
    <!-- torso armour -->
    <rect x="9" y="22" width="21" height="18" fill="#4a90d9"/>
    <rect x="9" y="22" width="21" height="3" fill="#6fb0f0"/>
    <rect x="9" y="36" width="21" height="4" fill="#2f6ea8"/>
    <!-- gold chest emblem -->
    <rect x="16" y="27" width="6" height="7" fill="#f0c95a"/>
    <rect x="18" y="25" width="2" height="11" fill="#f0c95a"/>
    <!-- mace: haft angled up, head raised clear of the muzzle. Sitting level
         with the muzzle it covered the nose and the face stopped reading. -->
    <rect x="30" y="27" width="4" height="3" fill="#6b4a2e"/>
    <rect x="33" y="21" width="3" height="7" fill="#6b4a2e"/>
    <rect x="33" y="11" width="7" height="10" fill="#9aa6b2"/>
    <rect x="33" y="11" width="7" height="2" fill="#c9d4de"/>
    <rect x="35" y="14" width="4" height="4" fill="#7fd4ff"/>
    <!-- legs, kept apart so they read as two -->
    <rect x="11" y="40" width="6" height="12" fill="#2f6ea8"/>
    <rect x="22" y="40" width="6" height="12" fill="#2f6ea8"/>
    <rect x="10" y="52" width="8" height="4" fill="#6b4a2e"/>
    <rect x="21" y="52" width="8" height="4" fill="#6b4a2e"/>
  </g>
</svg>
