<svg xmlns="http://www.w3.org/2000/svg" width="34" height="46" viewBox="0 0 34 46" shape-rendering="crispEdges">
  <!-- Bannerman — ram standard-bearer, faces RIGHT, banner raised behind.
       Dominant bronze 0xb08d57. The raised flag is the unit's whole point —
       it should be readable as "a leader standing among troops" even in a
       crowded lane, the same way the tanker's shield reads as "block". -->
  <g>
    <!-- curled horns -->
    <path d="M9 6 L5 1 L11 5 Z" fill="#6b4a2e"/>
    <path d="M21 5 L27 1 L23 6 Z" fill="#6b4a2e"/>
    <!-- head -->
    <rect x="7" y="5" width="16" height="12" fill="#b08d57"/>
    <rect x="7" y="5" width="16" height="3" fill="#d4b57a"/>
    <rect x="11" y="10" width="3" height="3" fill="#1c1c1c"/>
    <rect x="18" y="12" width="5" height="4" fill="#e8d4a8"/>
    <!-- torso -->
    <rect x="6" y="17" width="17" height="16" fill="#b08d57"/>
    <rect x="6" y="17" width="17" height="3" fill="#d4b57a"/>
    <rect x="6" y="30" width="17" height="3" fill="#7a5c34"/>
    <!-- banner pole, raised behind and above -->
    <rect x="24" y="2" width="2" height="30" fill="#6b4a2e"/>
    <rect x="26" y="2" width="7" height="10" fill="#c94f4f"/>
    <rect x="26" y="2" width="7" height="3" fill="#e87a7a"/>
    <!-- legs -->
    <rect x="9" y="33" width="6" height="10" fill="#7a5c34"/>
    <rect x="18" y="33" width="6" height="10" fill="#7a5c34"/>
    <rect x="7" y="42" width="8" height="4" fill="#3a3a3a"/>
    <rect x="17" y="42" width="8" height="4" fill="#3a3a3a"/>
  </g>
</svg>
