<svg xmlns="http://www.w3.org/2000/svg" width="96" height="120" viewBox="0 0 96 120" shape-rendering="crispEdges">
  <!-- Grave Warden — the boss. Faces LEFT. Dominant purple 0x6b4a8a as
       established.

       Rebuilt after a contact-sheet review: the first pass read as a flat
       purple slab. Three things fix that at this size — a much darker robe base
       so the lighter purple becomes highlight rather than the whole mass, a
       scythe with a blade long enough to break the outline (a small blade just
       reads as a grey smudge), and pauldrons that give the shoulders a
       silhouette instead of a straight edge. -->
  <g>
    <!-- scythe drawn first so the robe overlaps its haft: the blade sweeps out
         to the left, well clear of the body, which is what makes it read as a
         weapon rather than as decoration -->
    <rect x="20" y="14" width="5" height="96" fill="#4a3524"/>
    <rect x="21" y="14" width="2" height="96" fill="#6b4f36"/>
    <path d="M22 16 L2 22 L4 32 L14 30 L22 26 Z" fill="#d8e2ea"/>
    <path d="M22 16 L2 22 L3 26 L22 21 Z" fill="#ffffff"/>
    <path d="M4 32 L14 30 L12 36 Z" fill="#9aa6b2"/>

    <!-- crown -->
    <path d="M32 18 L36 4 L42 18 Z" fill="#c9a84a"/>
    <path d="M45 16 L51 0 L57 16 Z" fill="#f0c95a"/>
    <path d="M60 18 L66 5 L70 18 Z" fill="#c9a84a"/>
    <rect x="32" y="16" width="38" height="4" fill="#f0c95a"/>

    <!-- hood: dark outer, lighter inner rim -->
    <rect x="28" y="18" width="46" height="30" fill="#2e1f3d"/>
    <rect x="31" y="20" width="40" height="26" fill="#4d3363"/>
    <!-- face recess: pure black so the eyes carry all the contrast -->
    <rect x="34" y="24" width="34" height="20" fill="#100a16"/>
    <rect x="38" y="29" width="9" height="8" fill="#9ef0c0"/>
    <rect x="55" y="29" width="9" height="8" fill="#9ef0c0"/>
    <rect x="40" y="31" width="4" height="4" fill="#ffffff"/>
    <rect x="57" y="31" width="4" height="4" fill="#ffffff"/>

    <!-- pauldrons, breaking the shoulder line -->
    <rect x="22" y="46" width="16" height="12" fill="#6b6b7a"/>
    <rect x="22" y="46" width="16" height="3" fill="#9a9aad"/>
    <rect x="64" y="46" width="16" height="12" fill="#6b6b7a"/>
    <rect x="64" y="46" width="16" height="3" fill="#9a9aad"/>

    <!-- robe: dark base, lighter panel down the centre -->
    <rect x="28" y="48" width="46" height="44" fill="#3a2850"/>
    <rect x="24" y="74" width="54" height="30" fill="#32224a"/>
    <rect x="38" y="48" width="26" height="52" fill="#6b4a8a"/>
    <rect x="38" y="48" width="26" height="4" fill="#8a63ad"/>

    <!-- chest sigil -->
    <rect x="43" y="58" width="16" height="18" fill="#100a16"/>
    <rect x="46" y="62" width="10" height="10" fill="#9ef0c0"/>
    <rect x="49" y="65" width="4" height="4" fill="#ffffff"/>

    <!-- robe folds on the dark flanks -->
    <rect x="30" y="80" width="4" height="22" fill="#241634"/>
    <rect x="68" y="80" width="4" height="22" fill="#241634"/>

    <!-- skeletal hand gripping the haft -->
    <rect x="16" y="60" width="12" height="9" fill="#e8e0d0"/>
    <rect x="16" y="63" width="12" height="2" fill="#b8b0a0"/>

    <!-- hem and ground shadow -->
    <rect x="24" y="104" width="54" height="8" fill="#241634"/>
    <rect x="20" y="112" width="62" height="5" fill="#160e20"/>
    <rect x="26" y="117" width="50" height="3" fill="#100a16"/>
  </g>
</svg>
