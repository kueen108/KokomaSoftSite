<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44" shape-rendering="crispEdges">
  <!-- Archer — hawk marksman, faces RIGHT, longbow held forward.
       Dominant green 0x5cb85c, new to the ally palette (blue/gold already
       taken). Thin frame and a bow silhouette read as "ranged" at a glance,
       distinct from the tanker's shield and the dealer's twin blades. -->
  <g>
    <!-- crest feather -->
    <path d="M13 4 L11 0 L16 4 Z" fill="#3a7a34"/>
    <!-- head -->
    <rect x="6" y="3" width="14" height="11" fill="#5cb85c"/>
    <rect x="6" y="3" width="14" height="3" fill="#7ed957"/>
    <!-- beak -->
    <path d="M20 7 L25 9 L20 11 Z" fill="#e8c15a"/>
    <!-- eye -->
    <rect x="10" y="6" width="3" height="3" fill="#1c1c1c"/>
    <!-- torso -->
    <rect x="5" y="14" width="15" height="14" fill="#5cb85c"/>
    <rect x="5" y="14" width="15" height="3" fill="#7ed957"/>
    <rect x="5" y="25" width="15" height="3" fill="#3a7a34"/>
    <!-- folded wing, trailing -->
    <rect x="1" y="16" width="5" height="10" fill="#3a7a34"/>
    <!-- longbow held forward, string taut -->
    <rect x="21" y="10" width="2" height="20" fill="#c9a06a"/>
    <rect x="23" y="11" width="1" height="18" fill="#e8e4dc"/>
    <!-- legs -->
    <rect x="8" y="28" width="5" height="10" fill="#3a7a34"/>
    <rect x="15" y="28" width="5" height="10" fill="#3a7a34"/>
    <!-- talons -->
    <rect x="7" y="38" width="7" height="4" fill="#3a3a3a"/>
    <rect x="14" y="38" width="7" height="4" fill="#3a3a3a"/>
  </g>
</svg>
