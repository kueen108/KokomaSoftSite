<svg xmlns="http://www.w3.org/2000/svg" width="34" height="46" viewBox="0 0 34 46" shape-rendering="crispEdges">
  <!-- Dealer — lean fox fighter, faces RIGHT, twin blades.
       Dominant gold 0xd8a13f as established. Narrow body and pointed ears give
       it the opposite silhouette to the tanker's wide shield, which is the only
       thing that reads reliably at 34px. -->
  <g>
    <!-- pointed ears -->
    <path d="M8 6 L9 0 L14 6 Z" fill="#d8a13f"/>
    <path d="M20 6 L24 0 L25 6 Z" fill="#d8a13f"/>
    <!-- head, tapering to a snout on the right -->
    <rect x="8" y="5" width="15" height="12" fill="#d8a13f"/>
    <rect x="22" y="10" width="6" height="6" fill="#eec173"/>
    <rect x="27" y="11" width="2" height="3" fill="#2b2118"/>
    <rect x="18" y="9" width="3" height="3" fill="#2b2118"/>
    <rect x="9" y="12" width="10" height="5" fill="#f3e6d0"/>
    <!-- slim torso -->
    <rect x="10" y="17" width="13" height="15" fill="#d8a13f"/>
    <rect x="10" y="17" width="13" height="3" fill="#eec173"/>
    <rect x="10" y="29" width="13" height="3" fill="#a8762a"/>
    <!-- leather belt -->
    <rect x="10" y="24" width="13" height="3" fill="#6b4a2e"/>
    <!-- twin blades: lead blade forward, off-hand blade trailing -->
    <rect x="23" y="20" width="10" height="3" fill="#c9d4de"/>
    <rect x="31" y="19" width="3" height="5" fill="#e8f0f6"/>
    <rect x="2" y="26" width="9" height="3" fill="#c9d4de"/>
    <!-- legs -->
    <rect x="11" y="32" width="5" height="10" fill="#a8762a"/>
    <rect x="18" y="32" width="5" height="10" fill="#a8762a"/>
    <!-- feet kept apart: butted together they rendered as one dark bar -->
    <rect x="9" y="41" width="7" height="4" fill="#3a3a3a"/>
    <rect x="18" y="41" width="7" height="4" fill="#3a3a3a"/>
    <!-- brush tail, attached to the hip and angled down so it reads as a tail
         rather than as a detached blob beside the body -->
    <rect x="5" y="20" width="6" height="5" fill="#d8a13f"/>
    <rect x="2" y="23" width="5" height="5" fill="#d8a13f"/>
    <rect x="1" y="26" width="4" height="4" fill="#f3e6d0"/>
  </g>
</svg>
