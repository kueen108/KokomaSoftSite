<svg xmlns="http://www.w3.org/2000/svg" width="44" height="52" viewBox="0 0 44 52" shape-rendering="crispEdges">
  <!-- Overseer — hooded staff-caster, faces LEFT. Dominant purple 0x7a4fae,
       new to the enemy palette. A raised staff and a flowing robe (instead
       of visible legs) read as "commander who empowers others" rather than
       "another thing that hits you", separating it from every melee enemy. -->
  <g>
    <!-- hood -->
    <rect x="8" y="4" width="22" height="16" fill="#7a4fae"/>
    <rect x="8" y="4" width="22" height="4" fill="#9a70cc"/>
    <!-- face shadow under the hood -->
    <rect x="11" y="10" width="14" height="8" fill="#1c1428"/>
    <!-- glowing eyes -->
    <rect x="13" y="12" width="4" height="4" fill="#ffe14a"/>
    <rect x="21" y="12" width="4" height="4" fill="#ffe14a"/>
    <!-- flowing robe -->
    <rect x="6" y="20" width="26" height="24" fill="#7a4fae"/>
    <rect x="6" y="20" width="26" height="4" fill="#9a70cc"/>
    <rect x="4" y="40" width="30" height="8" fill="#4a2e6b"/>
    <!-- arm raised to the staff -->
    <rect x="27" y="22" width="6" height="6" fill="#6b3f94"/>
    <!-- staff, raised above the head -->
    <rect x="33" y="2" width="2" height="34" fill="#6b4a2e"/>
    <rect x="30" y="0" width="8" height="8" fill="#c94fae"/>
    <rect x="31" y="1" width="6" height="2" fill="#e89ad4"/>
  </g>
</svg>
