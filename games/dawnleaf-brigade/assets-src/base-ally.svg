<svg xmlns="http://www.w3.org/2000/svg" width="70" height="130" viewBox="0 0 70 130" shape-rendering="crispEdges">
  <!-- Ally keep. Dominant green 0x3f9e5a as established — carried by the roof
       and banner so the silhouette still reads "friendly stronghold" while the
       colour stays what the game has always shown here. -->
  <g>
    <!-- banner pole and flag -->
    <rect x="33" y="0" width="3" height="20" fill="#6b4a2e"/>
    <path d="M36 3 L60 9 L36 15 Z" fill="#3f9e5a"/>
    <rect x="42" y="7" width="5" height="4" fill="#f0c95a"/>
    <!-- battlements -->
    <rect x="6" y="18" width="58" height="10" fill="#3f9e5a"/>
    <rect x="6" y="14" width="10" height="6" fill="#3f9e5a"/>
    <rect x="24" y="14" width="10" height="6" fill="#3f9e5a"/>
    <rect x="42" y="14" width="10" height="6" fill="#3f9e5a"/>
    <rect x="58" y="14" width="6" height="6" fill="#3f9e5a"/>
    <rect x="6" y="18" width="58" height="3" fill="#63c47e"/>
    <!-- stone body -->
    <rect x="10" y="28" width="50" height="92" fill="#b9b2a4"/>
    <rect x="10" y="28" width="50" height="4" fill="#d2ccc0"/>
    <!-- coursing -->
    <rect x="10" y="44" width="50" height="2" fill="#948d80"/>
    <rect x="10" y="62" width="50" height="2" fill="#948d80"/>
    <rect x="10" y="80" width="50" height="2" fill="#948d80"/>
    <rect x="10" y="98" width="50" height="2" fill="#948d80"/>
    <!-- windows -->
    <rect x="20" y="50" width="8" height="10" fill="#2f4a3a"/>
    <rect x="42" y="50" width="8" height="10" fill="#2f4a3a"/>
    <!-- gate, facing the lane -->
    <rect x="25" y="86" width="20" height="34" fill="#5a4030"/>
    <rect x="25" y="86" width="20" height="4" fill="#3f9e5a"/>
    <rect x="34" y="94" width="3" height="20" fill="#3a2416"/>
    <!-- footing -->
    <rect x="6" y="120" width="58" height="7" fill="#948d80"/>
    <rect x="6" y="127" width="58" height="3" fill="#6f6a60"/>
  </g>
</svg>
