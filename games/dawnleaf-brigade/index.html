<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dawnleaf Brigade · The Four Oaths</title>
    <style>
      /* Game font (SPEC-COMBAT-FEEL-001 REQ-011). BootScene waits for it with
         a bounded timeout before the first text object is created. */
      @font-face {
        font-family: 'Galmuri11';
        src: url('/assets/fonts/Galmuri11.woff2') format('woff2');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #16181d;
        overflow: hidden;
      }
      canvas {
        touch-action: none;
      }
      #game {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game" role="application" aria-label="Dawnleaf Brigade · The Four Oaths"></div>
    <div class="landscape-note">Rotate to landscape for a wider battlefield.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
